name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything here runs without a GPU: compile, the JUnit suite (graph compiler output,
# serialization round trips, camera and animation maths, the node graph panel built with
# a stub controller), and the shaded jar. The JavaFX toolkit is started for the panel
# test, which is why the Linux runner needs a virtual display. Rendering itself is
# covered by the GPU harnesses in docs/RENDERING.md and is run by hand on real hardware.
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Virtual display for the JavaFX toolkit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libgl1 libxtst6 libxxf86vm1 libasound2t64

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" mvn -B verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: mvn -B verify

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore
