name: Release

# Builds the portable folders and the Windows installer, and publishes them on a GitHub release.
#
#   git tag v3.2.0 && git push origin v3.2.0
#
# The tag is the version: v3.2.0 becomes app-version 3.2.0 (the MSI accepts numbers and dots
# only, the last number below 65536). Three assets are attached to the release:
#   Fractaliz3r-<version>-windows.zip   portable folder, Windows   (Fractaliz3r.exe)
#   Fractaliz3r-<version>.msi           Windows installer          (Start menu entry, shortcut, uninstall)
#   Fractaliz3r-<version>-linux.tar.gz  portable folder, Linux x64 (bin/Fractaliz3r)
# Each embeds its own Java runtime; the target machine needs nothing but a GPU with
# OpenGL 4.3. The hdri/ and presets/ folders travel with the app as plain folders (jpackage
# --input; the app finds them through -Dfractalizer.data=$APPDIR). The build itself is the
# documented one (docs/EXPORT.md, "Building a Release"): jlink image with the LWJGL natives
# of the building OS, then jpackage on top of it.
# A manual run (workflow_dispatch) builds the same files as version 0.0.<run number> and keeps
# them as workflow artifacts instead of publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # jpackage produces an .msi through WiX 3 (candle/light on the PATH).
      - name: Install WiX 3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $bin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin" -Directory | Select-Object -First 1
          if (-not $bin) { throw "WiX 3 bin directory not found" }
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: jlink image with LWJGL natives
        run: mvn -B -Prelease clean javafx:jlink package -DskipTests

      - name: Data folders shipped next to the app
        shell: bash
        run: |
          mkdir -p target/extras
          cp -r hdri presets target/extras/
          rm -f target/extras/presets/*.jpg target/extras/presets/*.png
          du -sh target/extras/*

      - name: Installer and portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $common = @(
            '--name', 'Fractaliz3r',
            '--app-version', $env:VERSION,
            '--vendor', 'Renaud Warnotte',
            '--description', 'Real-time cinematic 3D fractal renderer',
            '--runtime-image', 'target/image',
            '--module', 'Fractaliz3r/org.fractalizer.Launcher',
            '--icon', 'src/main/resources/icons/fractaliz3r.ico',
            '--input', 'target/extras',
            '--java-options', '-Dorg.lwjgl.librarypath=$ROOTDIR\runtime\bin',
            '--java-options', '-Dfractalizer.data=$APPDIR'
          )
          jpackage --type msi --dest target/installer @common --license-file LICENSE `
            --win-menu --win-shortcut --win-dir-chooser --win-per-user-install `
            --win-upgrade-uuid 6f1b3c2e-7a4d-4b8e-9c21-3d5e7f9a1b2c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jpackage --type app-image --dest target/portable @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($d in 'app/hdri', 'app/presets', 'runtime/bin/lwjgl.dll') {
            if (-not (Test-Path "target/portable/Fractaliz3r/$d")) { throw "missing from the portable build: $d" }
          }
          Compress-Archive -Path target/portable/Fractaliz3r -DestinationPath "target/installer/Fractaliz3r-$env:VERSION-windows.zip"
          Get-ChildItem target/installer

      - uses: actions/upload-artifact@v7
        with:
          name: fractaliz3r-windows
          path: |
            target/installer/*.msi
            target/installer/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: jlink image with LWJGL natives
        run: mvn -B -Prelease clean javafx:jlink package -DskipTests

      - name: Data folders shipped next to the app
        run: |
          mkdir -p target/extras
          cp -r hdri presets target/extras/
          rm -f target/extras/presets/*.jpg target/extras/presets/*.png
          du -sh target/extras/*

      - name: Portable tarball
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          jpackage --type app-image --dest target/portable \
            --name Fractaliz3r --app-version "$VERSION" --vendor 'Renaud Warnotte' \
            --description 'Real-time cinematic 3D fractal renderer' \
            --runtime-image target/image --module Fractaliz3r/org.fractalizer.Launcher \
            --icon src/main/resources/icons/fractaliz3r_512.png \
            --input target/extras \
            --java-options '-Dorg.lwjgl.librarypath=$ROOTDIR/lib/runtime/bin' \
            --java-options '-Dfractalizer.data=$APPDIR'
          for d in lib/app/hdri lib/app/presets lib/runtime/bin/liblwjgl.so; do
            test -e "target/portable/Fractaliz3r/$d" || { echo "missing from the portable build: $d"; exit 1; }
          done
          cat target/portable/Fractaliz3r/lib/app/Fractaliz3r.cfg
          mkdir -p target/installer
          tar -C target/portable -czf "target/installer/Fractaliz3r-$VERSION-linux.tar.gz" Fractaliz3r
          ls -l target/installer

      - uses: actions/upload-artifact@v7
        with:
          name: fractaliz3r-linux
          path: target/installer/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
